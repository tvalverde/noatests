<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis notas · Exámenes de Noa</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#f7a823">
<style>
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#fff7e6;color:#333}
  header{background:#2bb3d9;color:#fff;padding:24px 16px;text-align:center}
  header h1{margin:0;font-size:1.8rem}
  nav.migas{font-size:.9rem;margin-bottom:8px}
  nav.migas a{color:#fff;text-decoration:underline}
  main{max-width:720px;margin:0 auto;padding:16px}
  .materia{background:#fff;border-radius:16px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;border-left:8px solid #2bb3d9}
  .materia>h2{margin:0;padding:14px 16px;font-size:1.25rem;display:flex;justify-content:space-between;align-items:center}
  .media{font-size:1rem;background:#fff3cd;border-radius:12px;padding:3px 10px;white-space:nowrap}
  .media.sin{background:#eee;color:#777;font-weight:normal;font-size:.85rem}
  details.tema{border-top:1px solid #eee}
  details.tema>summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px}
  details.tema>summary::-webkit-details-marker{display:none}
  details.tema>summary::before{content:"▸";margin-right:8px;color:#999;transition:transform .15s}
  details.tema[open]>summary::before{transform:rotate(90deg)}
  details.tema>summary .sub{font-weight:normal;color:#777;font-size:.85rem;display:block}
  .cuerpo{padding:0 16px 14px}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #eee;vertical-align:middle}
  th{color:#777;font-weight:normal;font-size:.85rem}
  td.nota{font-weight:bold;white-space:nowrap}
  td.fecha{color:#777;font-size:.85rem;white-space:nowrap}
  tr.sin td{color:#aaa}
  tr.sin td.nota{font-weight:normal}
  td a{color:#333;text-decoration:none}
  tr:not(.sin) td a{text-decoration:underline}
  h3{font-size:.95rem;color:#555;margin:16px 0 6px}
  .barra{background:#eee;border-radius:6px;height:12px;overflow:hidden}
  .barra i{display:block;height:100%;background:#4caf50}
  .barra.mal i{background:#e4452c}.barra.medio i{background:#f7a823}
  .vacio{color:#777;text-align:center;padding:20px}
  .aviso{font-size:.85rem;color:#777;margin-top:10px}
  .arts{padding:14px 16px;color:#555}
</style>
</head>
<body>
<header><nav class="migas"><a href="../">Inicio</a> › <span>Mis notas</span></nav><h1>Mis notas</h1></header>
<main id="contenido"><div class="vacio">Cargando…</div></main>
<script src="../sync.js?v=17"></script>
<script src="notas.js"></script>
<script src="copia.js"></script>
<script src="../sw-registro.js"></script>
</body>
</html>

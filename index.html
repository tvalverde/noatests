<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exámenes de Noa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7a823">
<style>
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#fff7e6;color:#333}
  header{background:#f7a823;color:#fff;padding:24px 16px;text-align:center}
  header h1{margin:0;font-size:1.8rem}
  main{max-width:600px;margin:0 auto;padding:16px}
  a.examen{display:block;background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;text-decoration:none;color:#333;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:8px solid #2bb3d9;font-size:1.2rem}
  a.examen span{display:block;font-size:.95rem;color:#777;margin-top:4px}
  a.examen{position:relative;padding-right:120px}
  .nota-lista{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#fff;border-radius:12px;padding:2px 10px;font-size:.95rem}
</style>
</head>
<body>
<header><h1>Exámenes de Noa</h1></header>
<main data-lista="portada"></main>
<script src="listas.js"></script>
<script src="sw-registro.js"></script>
</body>
</html>

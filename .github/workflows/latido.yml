name: Latido Supabase (evita la pausa del plan gratuito)

# Supabase pausa los proyectos gratuitos con poca actividad de base de datos en 7 días.
# Llamamos dos veces al día a una función que escribe en una tabla real y lee las de la app.
on:
  schedule:
    - cron: "23 7 * * *"
    - cron: "41 18 * * *"
  workflow_dispatch:

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - name: Latido (3 llamadas)
        run: |
          for i in 1 2 3; do
            curl -sS -f --retry 3 --retry-delay 20 -X POST "https://zwvipvswiguxqjsblijo.supabase.co/rest/v1/rpc/latido" \
              -H "apikey: sb_publishable_SYUGY1AdqIU4wM142_o4Dg_mscFfSzm" \
              -H "Authorization: Bearer sb_publishable_SYUGY1AdqIU4wM142_o4Dg_mscFfSzm" \
              -H "Content-Type: application/json" -d '{}'
            echo
            sleep 30
          done
